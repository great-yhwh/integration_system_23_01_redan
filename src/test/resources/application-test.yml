spring:
  data:
    mongodb:
      database: test_db

cms:
  page-size: 10

sync:
  interval: 999999999

report:
  api-url: http://localhost:4501/report

report-sync:
  interval: 999999999

logging:
  pattern:
    console: "%-5level %logger{36} : %msg%n"
  level:
    root: WARN
    ru.student35.sync: INFO
    org.apache.camel: WARN
    org.springframework: WARN
    org.springframework.data.mongodb: WARN
    org.mongodb.driver: WARN